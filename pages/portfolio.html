<!DOCTYPE html>
<html lang="fr">
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Portfolio – DARK G.H.</title>     
        <link rel="stylesheet" href="/DarkGH/css/style.css"> 
    </head>

    <body>
        <div class="wrapper">
            <header id="header" class="header"></header>

            <script src="/DarkGH/js/header.js"></script>
            <script>
                document.addEventListener("headerLoaded", () => {
                    const portfolio = document.getElementById("portfolio");
                    portfolio.classList.add("nav-active");
                });
            </script>

            <main>
                <section>
                    <h1 class="title">Portfolio</h1>
                    
                    <div class="text spaced">
                        <div class="section-portfolio">
                            <h2 class="subtitle">Compositions</h2>

                            <div class="main-grid">
                                <div>
                                    <h2 class="name">BGM – Ambiance d'exploration</h2>
                                    <iframe 
                                        class="youtube"
                                        src="https://www.youtube.com/embed/BejgJjMCSbs" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                        allowfullscreen>
                                    </iframe>
                                </div>

                                <div>
                                    <h2 class="name">Opening Theme – Stream</h2>
                                    <iframe 
                                        class="youtube"
                                        src="https://www.youtube.com/embed/ZqzcMgY8D7g" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                        allowfullscreen>
                                    </iframe>
                                </div>

                                <div>
                                    <h2 class="name">Musique dynamique</h2>
                                    <p>Intégration dans Tabletop Simulator</p>

                                    <video class="video-demo" controls>
                                        <source src="/DarkGH/assets/videos/Dynamic music.mp4" type="video/mp4">
                                    </video>

                                    <script src="/DarkGH/js/video-volume.js"></script>
                                </div>

                                <div>
                                    <h2 class="name">Sound Effects</h2>

                                    <div class="fader-wrap">
                                        <span>Volume : </span><span id="fader-value" class="fader-value">30</span>
                                        <span><input type="range" id="fader" class="fader" min="0" max="1" step="0.01" value="0.3"></span>
                                    </div>

                                    <div id="audio-table-container">
                                        <table id="audio-table" class="little-table"></table>
                                    </div>

                                    <audio id="player"></audio>

                                    <script type="module" src="/DarkGH/js/sound-effects.js"></script>

                                </div>
                            </div>
                        </div>

                        <div class="section-portfolio">
                            <h2 class="subtitle">Albums</h2>

                            <div class="albums-grid">
                                <div class="album-container" data-album="relax"></div>
                                <div class="album-container" data-album="paths"></div>
                                <div class="album-container" data-album="notdeadyet"></div>
                                <div class="album-container" data-album="dust"></div>
                                <div class="album-container" data-album="killorbekilled"></div>
                                <div class="album-container" data-album="peacefuldreams"></div>

                                <script src="/DarkGH/js/album-template.js"></script>
                            </div>
                        </div>

                    </div>
                </section>
            </main>
            
            <div id="footer"></div>

            <script src="/DarkGH/js/footer.js"></script>
        </div>
    </body>
</html>
