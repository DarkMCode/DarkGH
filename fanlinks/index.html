<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fanlinks – DARK G.H.</title>
        <link rel="stylesheet" href="/css/style.css">
        <link rel="icon" type="image/png" href="/assets/ico/ico.png">
    </head>

    <body>
        <div class="wrapper">
            <header id="header" class="header"></header>

            <script src="/js/header.js"></script>
            <script>
                document.addEventListener("headerLoaded", () => {
                    const fanlinks = document.getElementById("fanlinks");
                    fanlinks.classList.add("nav-active");
                });
            </script>
            
            <main>
                <section>
                    <h1 class="title">Fanlinks</h1>

                    <div id="fanlinks-table-container" class="fanlinks">
                        <table id="fanlinks-table" class="little-table"></table>
                    </div>

                    <script src="/js/fanlinks.js"></script>

                </section>
            </main>

            <div id="footer"></div>

            <script src="/js/footer.js"></script>
        </div>
    </body>
</html>
