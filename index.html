<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Accueil – DARK G.H.</title>
        <base src="/">
        <link rel="stylesheet" href="/css/style.css">
        <link rel="icon" type="image/png" href="/assets/ico/ico.png">
    </head>

    <body>
        <audio id="a1" src="/assets/musics/Davelthys 1 Master.mp3" preload="auto"></audio>
        <audio id="a2" src="/assets/musics/Davelthys 2 Master.mp3" preload="auto"></audio>
        <audio id="a3" src="/assets/musics/Davelthys 3 Master.mp3" preload="auto"></audio>
        <audio id="a4" src="/assets/musics/Davelthys 4 Master.mp3" preload="auto"></audio>
        <audio id="a5" src="/assets/musics/Davelthys 5 Master.mp3" preload="auto"></audio>
        <audio id="a6" src="/assets/musics/Davelthys 6 Master.mp3" preload="auto"></audio>
        <audio id="a7" src="/assets/musics/Davelthys 7 Master.mp3" preload="auto"></audio>
        <audio id="a8" src="/assets/musics/Davelthys 8 Master.mp3" preload="auto"></audio>

        <div class="wrapper">
            <header id="header" class="header"></header>

            <script src="/js/header.js"></script>
            <script>
                document.addEventListener("headerLoaded", () => {
                    const index = document.getElementById("index");
                    index.classList.add("nav-active");
                });
            </script>
            
            <main>
                <section>
                    <h1 class="title">Compositions originales et sound design</h1>
                    <div class="text spaced">
                        <p class="intro-box">
                            Des musiques et ambiances conçues pour renforcer l’impact de vos contenus.
                        </p>
                    </div>
                    
                    <div class="text audio-demo">
                        <h2 style="margin-top:5px;">
                            Ambiance sonore évolutive
                        </h2>
                        <p>
                            Démo reproduisant le système audio interactif :<br>
                            trois ambiances pour une seule musique.<br>
                        </p>

                        <button id="playStopBtn" class="playbtn"><strong>Play</strong></button>

                        <div class="fader-wrap">
                            <p><span>Volume : </span><span id="fader-value" class="fader-value">30</span></p>
                            <input type="range" id="fader" class="fader" min="0" max="1" step="0.01" value="0.3">
                        </div>

                        <div class="audio-controls">
                            <button id="amb_down" class="btn btn-disabled" style="min-width: 150px;">Plus calme</button>
                            <button id="amb_up" class="btn btn-disabled" style="min-width: 150px;">Plus intense</button>
                        </div>

                        <div id="progress-container" class="progress-container">
                            <div id="progress-bar" class="progress-bar"></div>
                            <div id="progress-cover" class="progress-cover"></div>
                        </div>

                        <script src="/js/audio-demo.js"></script>
                    </div>
                </section>
            </main>

            <div id="footer"></div>

            <script src="/js/footer.js"></script>
        </div>

    </body>
</html>
